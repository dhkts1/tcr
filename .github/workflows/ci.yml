name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: every job here only reads the repo — none comment on PRs,
# push tags, or publish. Deny everything except contents:read so a compromised
# action can't escalate. Raise per-job if a future job needs to write.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Decide ONCE whether this change can possibly affect a build or a test, so the
  # four expensive jobs below can sit out a change that only edits prose. `ci`
  # sits out only its build and test steps: its secret scan runs on every change.
  #
  # Measured on #341, nine lines of apps/macos/appcast.xml: macos 294s, ci 179s,
  # tsan 122s, miri 88s, 715 seconds total, on a file nothing compiles.
  #
  # The rule lives in .github/scripts/changed-is-inert.sh rather than in a `paths:` block
  # here, for two reasons. A `paths:` filter at the `on:` level makes the whole
  # WORKFLOW not run, so a required check never reports and the pull request can
  # never merge; gating per job with `if:` still reports each job. And a rule in a
  # script can be run and tested, which is why the step below executes its own
  # fixture (14 cases, both directions) before it is allowed to answer.
  changes:
    name: changes
    runs-on: ubuntu-latest
    outputs:
      inert: ${{ steps.classify.outputs.inert }}
      tailnet: ${{ steps.classify.outputs.tailnet }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # A gate that cannot fail is not a gate: prove the classifier still
          # says `code` for source before trusting it to say `inert` for prose.
          .github/scripts/changed-is-inert.sh --self-check

          # Whether the opt-in tailnet-node job runs: a changed file that mentions
          # the feature, or the manifest, the lockfile or this workflow. Decided
          # on pushes to main too, so a release waiting on `macos` does not pay
          # for it either. With no base to diff against, it runs.
          tailnet_for() {
            if printf '%s\n' "$1" | grep -qxE 'Cargo\.toml|Cargo\.lock|\.github/workflows/ci\.yml'; then
              echo true; return
            fi
            for f in $1; do
              if [ -f "$f" ] && grep -qE 'tailnet-node|tailnet_node' "$f"; then echo true; return; fi
            done
            echo false
          }

          if [ -z "${BASE_SHA}" ]; then
            echo "not a pull request (push to main) — running everything but the opt-in tailnet job."
            echo "inert=false" >>"${GITHUB_OUTPUT}"
            if [ -z "${BEFORE_SHA}" ] || ! git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
              echo "tailnet=true" >>"${GITHUB_OUTPUT}"
            else
              tailnet="$(tailnet_for "$(git diff --name-only "${BEFORE_SHA}...HEAD")")"
              echo "tailnet: ${tailnet}"
              echo "tailnet=${tailnet}" >>"${GITHUB_OUTPUT}"
            fi
            exit 0
          fi

          paths="$(git diff --name-only "${BASE_SHA}...HEAD")"
          tailnet="$(tailnet_for "${paths}")"
          echo "tailnet: ${tailnet}"
          echo "tailnet=${tailnet}" >>"${GITHUB_OUTPUT}"
          echo "changed paths:"
          printf '%s\n' "${paths}" | sed 's/^/  /'

          verdict="$(printf '%s\n' "${paths}" | .github/scripts/changed-is-inert.sh)"
          echo "verdict: ${verdict}"
          if [ "${verdict}" = "inert" ]; then
            echo "nothing here can affect a build; ci runs only its secret scan, macos, tsan and miri will skip."
            echo "inert=true" >>"${GITHUB_OUTPUT}"
          else
            echo "inert=false" >>"${GITHUB_OUTPUT}"
          fi

  # Unlike macos, tsan and miri, this job carries no job-level `if:`. A
  # docs-only change still runs it, and every step after the secret scan
  # carries the inert condition on its own instead. The reason is the scan: a
  # token pasted into a README is the likeliest leak this repository has, and
  # a README edit is exactly the change the inert rule skips. A skipped job
  # reports as passing to branch protection, so a scan inside a skipped `ci`
  # would let that README merge with every required check green. On an inert
  # change this job costs a checkout and one scan, a few seconds.
  ci:
    name: ci
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The scan below reads the commits between the pull request's base
          # and head, and a depth-1 checkout has neither.
          fetch-depth: 0

      # The backstop for the pre-commit hook's `gitleaks git --staged`, with the
      # same .gitleaks.toml. That hook yields to `--no-verify` and a fork never
      # runs it, so without this step nothing on the way to `main` scans for
      # credentials at all.
      #
      # It scans the pull request's own commits (base..head), not the whole
      # history, so the result measures this change: an old finding that was
      # later allowlisted cannot turn every pull request red. On a push to main
      # it scans the pushed range; when the old tip is gone (a force push) it
      # scans the tree instead.
      #
      # The binary is the upstream release, pinned by version and by sha256,
      # rather than a third-party action: the checksum is what makes the pin
      # mean anything, and this job then runs no code beyond what it names.
      # To bump it, take the new line from the release's
      # gitleaks_<version>_checksums.txt.
      - name: Secret scan (gitleaks)
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSL -o "${RUNNER_TEMP}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${RUNNER_TEMP}/${tarball}" | sha256sum --check --strict
          tar -xzf "${RUNNER_TEMP}/${tarball}" -C "${RUNNER_TEMP}" gitleaks
          gitleaks="${RUNNER_TEMP}/gitleaks"
          "${gitleaks}" version

          if [ "${EVENT_NAME}" = "pull_request" ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif git cat-file -e "${PUSH_BEFORE}^{commit}" 2>/dev/null; then
            range="${PUSH_BEFORE}..${PUSH_AFTER}"
          else
            echo "old tip ${PUSH_BEFORE} is not in this clone; scanning the tree."
            "${gitleaks}" dir --no-banner --redact --verbose --config .gitleaks.toml .
            exit 0
          fi
          # `--remerge-diff` is what makes a merge commit's own changes visible.
          # gitleaks runs `git log -p -U0 <log-opts>` (sources/git.go:75-91 at
          # v8.30.1), and plain `git log -p` prints no diff for a merge, so a
          # value added while resolving a conflict reached main unscanned. The
          # remerge diff is the merge against git's own automatic merge of its
          # parents: only what the merge introduced, never each parent's whole
          # diff again (`-m` does that and reports one leak twice). `--cc` is no
          # help: gitleaks cannot parse a combined diff and scans nothing.
          # On a conflicted file gitleaks reports the path as `b/<path>`, so a
          # path allowlist in .gitleaks.toml must stay unanchored to cover it.
          echo "scanning commits ${range}, merge commits included"
          "${gitleaks}" git --no-banner --redact --verbose --config .gitleaks.toml --log-opts="--remerge-diff ${range}" .

      # The version here and rust-toolchain.toml's channel move together.
      - name: Install Rust toolchain
        if: needs.changes.outputs.inert != 'true'
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - name: Toolchain version
        if: needs.changes.outputs.inert != 'true'
        run: rustc -V && cargo -V && cargo clippy -V

      # Caches ~/.cargo/{registry,git} + target/. Auto-keys on Cargo.lock +
      # rustc version + job name, so this cache stays isolated from the tsan/
      # miri jobs' sanitizer builds. Typically 50-80% faster warm builds.
      - name: Cache cargo
        if: needs.changes.outputs.inert != 'true'
        uses: Swatinem/rust-cache@v2

      - name: Format
        if: needs.changes.outputs.inert != 'true'
        run: cargo fmt --all --check

      # An `--org` flag on an account verb narrows nothing now that account
      # names are unique, so one would be a lie in `--help`. It came back once
      # already, one verb at a time — see the script's own header.
      - name: No --org flag
        if: needs.changes.outputs.inert != 'true'
        run: scripts/check-no-org-flag.sh

      # SwiftUI's `.secondary`/`.tertiary` resolve against the system window
      # background, not this panel's own surfaces, so the contrast that
      # `tcrbar-palette.py` measures and gates never applied to them. Thirteen
      # text runs had drifted onto them, the worst at 1.86:1 — see the script.
      - name: No hierarchical styles used as panel ink
        if: needs.changes.outputs.inert != 'true'
        run: scripts/check-panel-ink.sh

      # `PanelV4/` is a transcription of the approved mockup's stylesheet, one
      # CSS declaration to one `V4` constant. Eleven adaptation rounds before it
      # drifted through hand-written sizes — a 16 here, an 8 there — so a view
      # that writes one, or reaches for a pre-v4 geometry token, is refused.
      - name: PanelV4 writes no sizes of its own
        if: needs.changes.outputs.inert != 'true'
        run: scripts/check-panel-v4.sh

      # This repository is public and takes pull requests from forks, which
      # never run `.githooks/pre-commit` — so a fork's branch can carry a
      # dangling citation of an internal planning path, or internal process
      # vocabulary, straight past every local gate (see the token list in
      # .githooks/lib/disclosure-scan.sh). This is the same check the hook
      # runs on a staged diff, run here over the whole tracked tree instead.
      - name: No internal-scaffolding citations in the tree
        if: needs.changes.outputs.inert != 'true'
        run: scripts/check-public-disclosure.sh

      # The same check, over the PR's own title and body: a description that
      # names internal scaffolding is exactly as public as a comment that
      # does. Skipped on a plain push to `main`, where there is no PR text to
      # check.
      - name: No internal-scaffolding citations in the PR title/body
        if: github.event_name == 'pull_request' && needs.changes.outputs.inert != 'true'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_TITLE" | scripts/check-public-disclosure.sh --stdin "PR title"
          printf '%s\n' "$PR_BODY" | scripts/check-public-disclosure.sh --stdin "PR body"

      # The disclosure gate's own fixtures. The hooks themselves are local and a
      # fork may not have them wired, so CI runs the suite that proves the scan
      # still refuses what it exists to refuse — a name, a home path, a real
      # email — in a diff AND in a commit message. A gate nobody has watched
      # fail is a gate that reports safety.
      - name: Disclosure scan fixtures
        if: needs.changes.outputs.inert != 'true'
        run: .githooks/test-disclosure-scan.sh

      # --locked: fail if CI would silently rewrite Cargo.lock. Pins the exact
      # dependency set that was reviewed — important for an auth-handling proxy.
      # --workspace: the root is a package as well as the workspace, so without
      # it clippy lints `tcr` alone and none of `crates/*`. The macOS half of
      # every `#[cfg(target_os = "macos")]` block is compiled out here; the
      # `macos` job runs the same command to lint it.
      - name: Clippy
        if: needs.changes.outputs.inert != 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        if: needs.changes.outputs.inert != 'true'
        run: cargo test --all --locked

      - name: Build (release)
        if: needs.changes.outputs.inert != 'true'
        run: cargo build --release --locked

      # Tokens.swift says a failing design token is a build error. Until this
      # step existed that was not true anywhere: build-tcrbar.sh never invokes
      # the generator, and the only real check was .githooks/pre-commit — which
      # fires only when a token SOURCE is staged, skips silently without
      # python3, and yields to --no-verify.
      #
      # It lives in `ci` and not `macos` even though the palette is the app's:
      # the script is stdlib-only Python and reads the geometry scale out of
      # Tokens.swift as TEXT, so it needs no Swift toolchain. Putting it on the
      # macOS runner would spend minutes billed at a multiple of Linux to answer
      # a question Linux can answer — the same rule the `macos` job's own
      # comment states. `ci` is likewise a required check on main, so the gate
      # blocks a merge either way.
      #
      # Emitting to a scratch dir and diffing catches the second half: a palette
      # edit that passes contrast but was never regenerated leaves the checked-in
      # stylesheet publishing the old hex under the generator's authority. The
      # generator writes nothing when it fails, so the diff cannot mask it.
      - name: Design tokens (contrast + freshness)
        if: needs.changes.outputs.inert != 'true'
        run: |
          python3 scripts/tcrbar-palette.py \
            --emit-css "$RUNNER_TEMP/tokens.css" \
            --emit-json "$RUNNER_TEMP/tokens.json"
          diff -u apps/macos/design-tokens/tokens.css "$RUNNER_TEMP/tokens.css"
          diff -u apps/macos/design-tokens/tokens.json "$RUNNER_TEMP/tokens.json"

  # The only job on a macOS runner, and the only place any Swift is compiled.
  # Before this existed the app's Swift tests had never run in CI at all, so a
  # Rust-side change could silently break TcrBar with every check green.
  #
  # Re-runs clippy but not fmt. Formatting is platform-independent and already
  # gated by `ci`; clippy is not, because it lints only the code that compiles
  # for the runner's OS, and the XPC client and listener, the helper's `mod
  # helper` and the macOS half of the fan identity exist only on macOS. macOS
  # runner minutes are billed at a multiple of Linux, so this job runs only
  # what Linux cannot answer.
  # ── macos ───────────────────────────────────────────────────────────────
  # Only what a Linux runner cannot answer, on macOS runners that run side by
  # side. As one serial job this took 16 to 18 minutes, and every merge and
  # `ship-release.sh` waited on it: 8 of those minutes re-ran the whole Rust
  # suite `ci` already runs on Linux, and 4.75 built an opt-in feature for 24
  # tests that take one second. Now each job carries only its macOS reason, and
  # the wall time is the slowest of them. The `macos` job at the end is the one
  # branch protection and ship-release.sh name; it passes only when every job
  # it waits on passed or, for the opt-in tailnet job alone, was skipped.
  macos-test:
    name: macos-test
    needs: changes
    if: needs.changes.outputs.inert != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0

      - name: Toolchain version
        run: rustc -V && cargo -V

      # Auto-keys on runner OS and job id as well as Cargo.lock, so each macOS
      # job keeps its own target cache.
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The modules whose behaviour differs on macOS, and only those: the rest of
      # the suite is platform-neutral and `ci` runs it on Linux. singleton shells
      # out to `ps`/`lsof` (BSD flags, other columns); update places a binary by
      # rename(2); fan, fan_probe and the four fan crates drive Apple's SMC;
      # handoff, claude_code_login and peer::reach carry
      # `#[cfg(target_os = "macos")]` paths. `--lib` builds one test binary
      # instead of every integration target, which is most of the time saved.
      # A module that gains macOS-only behaviour joins this filter list.
      - name: Test (rust, macOS-specific modules)
        run: |
          cargo test --locked -p tcr --lib -- \
            singleton:: update:: fan:: fan_probe:: handoff:: claude_code_login:: peer::reach::
          cargo test --locked -p tcr-fan -p tcr-smc -p tcr-fdpass -p tcr-fan-helper

  macos-clippy:
    name: macos-clippy
    needs: changes
    if: needs.changes.outputs.inert != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Toolchain version
        run: rustc -V && cargo -V && cargo clippy -V

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The same command as `ci`'s Clippy step, here for the code that step
      # never compiles: everything under `#[cfg(target_os = "macos")]`.
      - name: Clippy (macOS-only code)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # tcr's own tailnet node (`src/peer/tailnet_node.rs`) compiles only with the
  # `tailnet-node` feature on Apple silicon, which no release build turns on.
  # It runs only when the change touches a file that mentions the feature, or
  # Cargo.toml, Cargo.lock or this workflow (the `changes` job decides), so the
  # adapter cannot rot unseen and the other changes do not pay ~5 minutes for it.
  macos-tailnet:
    name: macos-tailnet
    needs: changes
    if: needs.changes.outputs.inert != 'true' && needs.changes.outputs.tailnet == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Clippy (tailnet-node feature)
        run: cargo clippy --workspace --all-targets --locked --features tailnet-node -- -D warnings

      # The one test that touches the real library (keys tcr mints read back
      # into the library's type) runs only with the feature.
      - name: Test (tailnet-node feature)
        run: cargo test --locked --features tailnet-node --lib tailnet_node

  macos-swift:
    name: macos-swift
    needs: changes
    if: needs.changes.outputs.inert != 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # Recorded so a runner-image bump that changes the Swift language mode is
      # attributable from the log rather than looking like a source regression.
      - name: Swift toolchain version
        run: swift --version

      # The Swift half of the `Format` job above. It lives here and not in `ci`
      # because swift-format ships inside the Xcode toolchain, which only the
      # macOS runner has.
      #
      # Resolved through xcrun rather than assumed on PATH: the toolchain binary
      # is not on a bare runner's PATH, and a bare `swift-format` would resolve
      # to whatever a future image happens to install instead.
      #
      # Scope is TcrBarCore + Tests, not all of Sources: Sources/TcrBar has a
      # large change in flight and is swept in a follow-up, at which point this
      # widens to `apps/macos/Sources`.
      - name: Format (swift)
        run: |
          swift_format="$(xcrun --find swift-format)"
          "$swift_format" --version
          "$swift_format" lint --strict -r apps/macos/Sources/TcrBarCore apps/macos/Tests

      # No SwiftPM cache: the package declares zero external dependencies, so
      # there is nothing to fetch, and .build artifacts key on the toolchain
      # and every source file — it would miss on essentially every run.
      - name: Build (swift)
        working-directory: apps/macos
        run: swift build

      # Reads tests/fixtures/status-contract.json by walking up from #filePath,
      # so it also proves the repo-relative fixture resolves on a clean checkout.
      - name: Test (swift)
        working-directory: apps/macos
        run: swift test

      # install.sh's TcrBar step (step 2) needs hdiutil and codesign, so this
      # is the only runner that can prove it: runs install.sh through `sh` on
      # stdin from an empty directory, the exact shape of the README's
      # `curl … | sh`, with a local http server standing in for
      # github.com/api.github.com/raw.githubusercontent.com. See the script's
      # own header for why that shape matters — `bash install.sh` cannot
      # reproduce the bug it guards against.
      - name: Test (install.sh)
        run: scripts/test-install-sh.sh

      # release-tcrbar.sh's upload step against a stub `gh`: the appcast-guard race, the
      # read-backs, and the TcrBar.dmg copy the site's Download button links to.
      - name: Test (release upload)
        run: apps/macos/scripts/release-upload-race-fixture-test.sh

  # The required check. Skipped when the change is inert, like the jobs above
  # (a skipped required check counts as passed, as the single job's did).
  # macos-test, macos-clippy and macos-swift must succeed; macos-tailnet must
  # succeed or have been skipped by its own gate. Anything else fails it,
  # cancelled included.
  macos:
    name: macos
    needs: [changes, macos-test, macos-clippy, macos-tailnet, macos-swift]
    if: always() && needs.changes.outputs.inert != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every macOS job passed
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.macos-test.result }}
          CLIPPY: ${{ needs.macos-clippy.result }}
          TAILNET: ${{ needs.macos-tailnet.result }}
          SWIFT: ${{ needs.macos-swift.result }}
        run: |
          echo "changes=$CHANGES macos-test=$TEST macos-clippy=$CLIPPY macos-tailnet=$TAILNET macos-swift=$SWIFT"
          [ "$CHANGES" = success ] && [ "$TEST" = success ] && [ "$CLIPPY" = success ] && [ "$SWIFT" = success ] \
            && { [ "$TAILNET" = success ] || [ "$TAILNET" = skipped ]; }

  audit:
    name: audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # install-action caches the cargo-audit binary itself, so no target cache
      # is needed here — audit reads Cargo.lock, it doesn't compile the crate.
      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Reports RustSec advisories. Exits non-zero only on real vulnerabilities;
      # unmaintained/unsound deps surface as warnings without failing the build.
      - name: Audit dependencies
        run: cargo audit

  # ── release-version (merge-time) ──────────────────────────────────────────
  # .githooks/pre-commit runs the same check, but it can only ever see the
  # tags that exist AT COMMIT TIME: the tag that actually invalidates a
  # branch is created later, at release. Two branches can each legitimately
  # bump to the same next version, both pass the commit-time hook, and merge
  # with no conflict at all (same line, same value) — nothing for a human to
  # notice. This job re-runs scripts/check-release-version.sh here, at PR
  # time, against a fully fetched tag list, which is when that collision
  # actually exists to be seen.
  #
  # NOT wired into branch protection by this change — see the PR body. A
  # non-required check is advisory only; it must be added to the required
  # checks list (alongside ci, audit, macos) to actually block a merge.
  release-version:
    name: release-version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          # A shallow clone has no tags, and the check would silently pass —
          # full history plus explicit tag fetch is load-bearing here, not
          # a nicety.
          fetch-depth: 0
          fetch-tags: true

      - name: Check release version
        run: |
          mapfile -t changed_files < <(git diff --name-only --diff-filter=ACMR \
            "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}" -- .)
          if [ "${#changed_files[@]}" -eq 0 ]; then
            echo "release-version: no changed files in this PR — nothing to check."
            exit 0
          fi
          scripts/check-release-version.sh --source=worktree "${changed_files[@]}"

  tsan:
    name: tsan
    needs: changes
    if: needs.changes.outputs.inert != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - name: ThreadSanitizer (stress harness)
        env:
          RUSTFLAGS: "-Zsanitizer=thread"
          RUSTDOCFLAGS: "-Zsanitizer=thread"
        run: |
          cargo +nightly test -Z build-std --target x86_64-unknown-linux-gnu \
            concurrent_pacing_stress -- concurrent_lock_stress --test-threads=1 --nocapture

  # miri (UB detection), best-effort/informational. Scoped to pure leaf modules
  # (no network/fs) since miri can't execute real I/O. continue-on-error keeps a
  # miri gap from blocking merges — a signal, not a required gate.
  miri:
    name: miri
    needs: changes
    if: needs.changes.outputs.inert != 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      # cache-on-failure: this job is continue-on-error, so still persist the
      # (expensive) miri build cache even when it surfaces UB, or every run
      # rebuilds std from scratch.
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      # cargo test takes ONE filter positional; run each pure module separately.
      # disable-isolation lets miri tolerate time/env access in the pure tests.
      - name: miri (pure tests)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation
        run: |
          cargo +nightly miri test model::
          cargo +nightly miri test account_uuid::
          cargo +nightly miri test quota::
