# The `tcr` library: everything reusable behind the `tcr` binary. Its sources stay in the
# repository's `src/` (the binary's own files there are `main.rs`, `tool_env.rs` and
# `build_stamp.rs`); only the manifest lives here.
#
# Why a package of its own: the root package owns build.rs, which stamps the binary with the
# commit and the wall clock and re-runs whenever HEAD moves. Cargo recompiles every target of the
# package that owns a build script each time it re-runs, so while the library sat in the root
# package it recompiled all of itself on every commit, and two checkouts of one commit never
# shared a cached build. This package has no build script, and the library takes the stamp as a
# value: the binary hands it over with `tcr::build_info::install` before anything else runs.
# `scripts/check-lib-build-stamp-free.sh` proves the library stays fresh across a restamp.
[package]
name = "tcr-lib"
version.workspace = true
edition = "2024"
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
publish = false
description = "The tcr library: proxy, manager, status and CLI rendering behind the tcr binary"
repository = "https://github.com/dhkts1/tcr"
autobins = false
autoexamples = false
autotests = false
autobenches = false

[lints]
workspace = true

[lib]
# The crate keeps its name, so the binary, the tests and the examples still `use tcr::...`.
name = "tcr"
path = "../../src/lib.rs"

[dependencies]
tcr-status-wire.workspace = true
tcr-fdpass.workspace = true
tokio.workspace = true
axum.workspace = true
hyper.workspace = true
hyper-util.workspace = true
reqwest.workspace = true
webpki-root-certs.workspace = true
tower.workspace = true
bytes.workspace = true
futures.workspace = true
eventsource-stream.workspace = true
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
oauth2.workspace = true
form_urlencoded.workspace = true
toml_edit.workspace = true
ratatui.workspace = true
crossterm.workspace = true
clap.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
time.workspace = true
tokio-rustls.workspace = true
rustls.workspace = true
rustls-pemfile.workspace = true
rcgen.workspace = true
tracing-appender.workspace = true
tempfile.workspace = true
listeners.workspace = true
sysinfo.workspace = true
snow.workspace = true
mdns-sd.workspace = true
if-addrs.workspace = true
tcr-peer-wire.workspace = true
tcr-smc.workspace = true
tcr-fan.workspace = true
getrandom.workspace = true
sha2.workspace = true
chacha20poly1305.workspace = true

# tcr's own tailnet node (`src/peer/tailnet_node.rs`), behind the `tailnet-node` feature below and
# only on Apple silicon, the one Mac target the crate supports (no Intel macOS). Gil approved it on
# 2026-10-20 for source builds only; no release build turns the feature on.
#
# Pinned exactly: the crate is pre-1.0 and 0.5.0 and 0.6.0 each broke its Rust API and its key
# format. It brings `aws-lc-sys`, the C crypto library this repository otherwise avoids
# (`src/http_client.rs`), and with both rustls providers compiled in rustls refuses to pick one, so
# `http_client::install_crypto_provider` must run before the first `Device::new`. The one place
# that calls `Device::new` (`tailnet_node`'s `LibraryFactory::build`) calls it first.
[target.'cfg(all(target_os = "macos", target_arch = "aarch64"))'.dependencies]
tailscale = { version = "=0.6.1", optional = true }

[features]
# Compiles `src/test_support` into the library for the integration tests (the root package's
# dev-dependency on this one turns it on). Never on in a release build: nothing outside tests
# enables it. The unit tests do not need it: `cfg(test)` compiles the module for them.
test-support = []
# tcr joins a tailnet as its own node (`tcr peer tailnet node`). Off by default and in release
# builds. It compiles the node only on Apple silicon (the `tailscale` crate above); on any other
# target the feature is accepted and does nothing, and `tcr peer tailnet node` is refused.
tailnet-node = ["dep:tailscale"]
