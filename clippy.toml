# Gil's rules ban .unwrap() and .expect() outside tests; .expect(...) is how a test fails with a message,
# so both lints are exempt inside #[test] functions and #[cfg(test)] modules.
allow-unwrap-in-tests = true
allow-expect-in-tests = true

# Product, protocol and vendor names that `doc_markdown` would otherwise want
# in backticks as if they were code. `..` keeps clippy's own default list.
doc-valid-idents = [
    "..",
    "ChatGPT",
    "OpenAI",
    "TcrBar",
    "TcrBarCore",
    "CodexBar",
    "UPnP",
    "WANIPConnection",
    "FedRAMP",
    "ClientHello",
    "SplitMix64",
    "OKLab",
    "AppKit",
    "TSan",
    "ThreadSanitizer",
    "WireGuard",
    "SipHash",
    "DoS",
]

# reqwest 0.13 is built with `rustls-no-provider`, and a client built before a rustls crypto
# provider is installed panics. `tcr::http_client::builder` installs ring first; these are the
# calls that skip it.
disallowed-methods = [
    { path = "reqwest::Client::builder", reason = "use tcr::http_client::builder, which installs the rustls crypto provider first" },
    { path = "reqwest::Client::new", reason = "use tcr::http_client::builder().build(), which installs the rustls crypto provider first" },
    { path = "reqwest::get", reason = "build a client with tcr::http_client::builder, which installs the rustls crypto provider first" },
]
