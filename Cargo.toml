# Explicit workspace, added alongside `crates/tcr-status-wire` (the shared
# `tcr status --json` wire type). Keep `apps/macos/**` OUT of `members` forever
# — `.github/workflows/ci.yml` runs `cargo test --all` / `cargo clippy
# --all-targets --locked` on ubuntu, and `--all` means `--workspace`: anything
# listed here compiles on Linux.
[workspace]
members = [".", "crates/tcr-status-wire", "crates/tcr-fdpass", "crates/tcr-peer-wire"]
resolver = "2"

# One lint table for every crate (each opts in with `[lints] workspace = true`).
# A lint whose fixes would make this code worse is turned off HERE with its
# reason, never silenced at a call site. Settings a lint needs live in
# clippy.toml.
[workspace.lints.rust]
unused_lifetimes = "warn"
redundant_lifetimes = "warn"
unreachable_pub = "warn"
trivial_numeric_casts = "warn"
unused_import_braces = "warn"
meta_variable_misuse = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
# Gil's rules for production code. `clippy.toml` sets allow-unwrap-in-tests and
# allow-expect-in-tests, so `#[test]` functions and `#[cfg(test)]` modules may unwrap and expect;
# integration-test crates carry one crate-level `#[expect]` for their helpers instead.
# No `.unwrap()` or `.expect()` outside tests.
unwrap_used = "deny"
expect_used = "deny"
# No `let _ = <must_use expr>`: a dropped `Result` goes through `tcr::log_err::LogErr` instead.
let_underscore_must_use = "deny"

pedantic = { level = "warn", priority = -1 }
# Pedantic lints turned off, each with the reason its fixes do not pay here.
# A binary, not a library: nobody reads a rustdoc `# Errors`/`# Panics`
# section or relies on `#[must_use]` across a crate boundary, and the three
# member crates have one consumer each, in this repository.
must_use_candidate = "allow"
return_self_not_must_use = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# The numeric casts are counts, byte sizes, milliseconds and ratios whose
# ranges the surrounding code already bounds; `try_from` at each one adds an
# error branch that cannot be taken, or a behaviour change where it can.
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
cast_sign_loss = "allow"
# Long functions here are long because they are a protocol's steps in order,
# with the reason for each step beside it; splitting them hides the order.
too_many_lines = "allow"
# A constant declared beside the one statement that uses it, with its reason
# in a comment, reads better than the same constant hoisted away from it.
items_after_statements = "allow"
# Names like `req`/`res` and `a`/`b` in tests are the clearest names.
similar_names = "allow"
many_single_char_names = "allow"
# Config and wire structs mirror JSON documents; their bools and their field
# names (`access_token`, `refresh_token`, `id_token`) are the format.
struct_excessive_bools = "allow"
struct_field_names = "allow"
# `write!` into a String returns a Result that can never be Err, so the fix
# trades one allocation for a discarded Result, against the no-`let _` rule.
format_push_string = "allow"
format_collect = "allow"
# Merging two match arms that do the same thing for different documented
# reasons loses the reasons.
match_same_arms = "allow"
# The `Manager` impl files under src/manager/ share their parent's imports
# through `use super::*` on purpose; expanding it lists a dozen names per file.
wildcard_imports = "allow"
# Its fix turns `assert!(v.is_empty())` into `assert_eq!(v, [] as [T; 0])`,
# naming the element type at every site; the original reads better.
assert_is_empty = "allow"
# `Default::default()` here is almost all fixture fields
# (`provider: Default::default()`), where the field name already says what is
# built, and the fix names a type the test module often does not import.
default_trait_access = "allow"
# An explicit `continue` in a loop's match arm says the arm skips the rest.
needless_continue = "allow"
# The flagged `_name` bindings are guards and handles held for their drop.
used_underscore_binding = "allow"
# `(2..).find(..)` and friends: finite because of what follows, which the lint
# cannot see.
maybe_infinite_iter = "allow"
# The flagged sites are tests that panic on a poisoned lock; naming the error
# adds nothing to a message that already says what failed.
match_wild_err_arm = "allow"
# A test float compared exactly is the point of the test.
float_cmp = "allow"
# Every hit compares a file name tcr wrote itself, lowercase by construction
# (`.tmp`, `.rs`); the fix is a three-line `Path::extension` chain that also
# starts accepting `.TMP`.
case_sensitive_file_extension_comparisons = "allow"
# Each hit is an arm like `refused => panic!("..{refused:?}")` that binds the
# one other variant to print it whole; naming the variant there says nothing more.
match_wildcard_for_single_variants = "allow"
# Signature lints whose hits are shapes the code needs:
# serde's `skip_serializing_if` and `with` functions must take `&T` and
# `&Option<T>` (trivially_copy_pass_by_ref, ref_option); clap hands each
# `run_*` its `Args` by value, a thread entry owns its channel, and test
# fixtures take owned JSON (needless_pass_by_value); `Option<Option<T>>` is a
# clap flag whose value is optional, or "absent or null" against "does not
# parse" (option_option); a `#[cfg(test)]` twin of `wall_now` reads `self`
# where the production one does not (unused_self); one hasher in a binary
# (implicit_hasher). unnecessary_wraps: the hits are test fixtures that build
# the `Option`/`Result` the code under test takes, and `quota::resolve_reset`,
# whose five callers store an `Option`, so the wrap would move to each caller.
trivially_copy_pass_by_ref = "allow"
ref_option = "allow"
needless_pass_by_value = "allow"
option_option = "allow"
unused_self = "allow"
implicit_hasher = "allow"
unnecessary_wraps = "allow"
# Every hit is a test or stub helper that calls `tokio::spawn` (so it must be
# called inside a runtime, which `async` says), an async trait method, or one of
# three peer entry points kept async beside their awaiting siblings. Dropping
# `async` moves an `.await` at every caller and says less.
unused_async = "allow"
unused_async_trait_impl = "allow"

# Nursery lints that find slower or larger code. The rest of the nursery group
# stays off: significant_drop_tightening, option_if_let_else,
# redundant_pub_crate, future_not_send, too_long_first_doc_paragraph,
# branches_sharing_code (its fix hoists a log line out of the branch that
# explains it), collection_is_never_read (a Vec that holds connections open
# by owning them) and needless_collect (its hits are tests that collect thread
# handles so every thread starts before the first join; without the collect
# they run one at a time) disagree with code here.
redundant_clone = "warn"
missing_const_for_fn = "warn"
or_fun_call = "warn"
use_self = "warn"
equatable_if_let = "warn"
iter_on_single_items = "warn"
needless_pass_by_ref_mut = "warn"
large_futures = "warn"

# Restriction lints, each with a hit or a hazard that justifies it.
dbg_macro = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
needless_raw_strings = "warn"
# An explicit `Arc::clone(&x)` says a reference count moves, not a deep copy.
clone_on_ref_ptr = "warn"
# A lint is silenced at a site with `#[expect(lint, reason = "...")]`, never
# `#[allow]`: an expectation that stops firing is itself a warning, so a stale
# suppression cannot outlive the code it was written for.
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
# Not empty_structs_with_brackets: its one hit is `MoveOffer {}` in
# tcr-peer-wire, and serde writes a braced empty struct as `{}` but a unit
# struct as `null`, so the fix changes the peer wire.

[package]
name = "tcr"
version = "1.2.11"
edition = "2024"
# The toolchain itself is pinned in rust-toolchain.toml; this is the floor a
# build with any other toolchain is held to.
rust-version = "1.99"
license = "PolyForm-Noncommercial-1.0.0"
# Noncommercial license, so this crate must never reach crates.io, whose terms
# require a license permitting redistribution and commercial use.
publish = false
description = "tcr (Team Capacity Router): a local proxy that runs Claude Code across multiple Claude accounts"
repository = "https://github.com/dhkts1/tcr"
homepage = "https://github.com/dhkts1/tcr"
# Integration tests are declared below rather than one crate per `tests/*.rs`: every test crate
# links the whole `tcr` library, so 53 of them meant 53 links per `cargo test`.
autotests = false

[lints]
workspace = true

# `publish = false` above hides this package from cargo-dist, which reads it to
# decide what is distributable, so v0.2.4's release job failed with "This
# workspace doesn't have anything for dist to Release!". This opts the binary
# back in without opting the crate back into crates.io.
[package.metadata.dist]
dist = true

[[bin]]
name = "tcr"
path = "src/main.rs"

# The load-test driver behind `scripts/load-test.sh` (docs/performance.md). `test = true` so
# `cargo test --all` runs its unit tests (stub reply shapes, report arithmetic); an example's
# tests are otherwise built and never run.
[[example]]
name = "load_test"
path = "examples/load_test/main.rs"
test = true

# One crate for the integration tests that can share a process: `tests/it/main.rs` names each
# file as a module, so `cargo test --test it peer_wire::` runs what `--test peer_wire` used to.
[[test]]
name = "it"
path = "tests/it/main.rs"

# Each of these stays its own process because it owns process-wide state a sibling module
# would see or break. The reason is beside each one, and in the file's own docs where it has one.
# A process-wide `tracing` subscriber, installed once with `set_global_default`:
[[test]]
name = "codex_log_lines"
path = "tests/codex_log_lines.rs"
[[test]]
name = "peer_forward"
path = "tests/peer_forward.rs"
[[test]]
name = "peer_refusal_log"
path = "tests/peer_refusal_log.rs"
[[test]]
name = "usage-ledger-write-failure-policy"
path = "tests/usage-ledger-write-failure-policy.rs"
# The global subscriber again, and an in-process `server::serve`, which installs the egress
# peers path, the peer-lease fallback and the probe path table for the whole process:
[[test]]
name = "peer_boot"
path = "tests/peer_boot.rs"
# `server::serve` in process (see `peer_boot`):
[[test]]
name = "serve_library_path"
path = "tests/serve_library_path.rs"
[[test]]
name = "peer_borrow_hot"
path = "tests/peer_borrow_hot.rs"
# `fallback::install_provider`, which installs once per process:
[[test]]
name = "codex_never_borrowed"
path = "tests/codex_never_borrowed.rs"
[[test]]
name = "peer_lease"
path = "tests/peer_lease.rs"
# `egress::install_peers_path`, which installs once per process:
[[test]]
name = "peer_egress"
path = "tests/peer_egress.rs"
# The leaf the process loaded last decides which CONNECT hosts `mitm` terminates:
[[test]]
name = "intercepted_host"
path = "tests/intercepted_host.rs"
# Both publish router mappings to the process-wide register `reach::external_socket` reads,
# which the dead-drop and listener paths in other modules advertise:
[[test]]
name = "peer_reach"
path = "tests/peer_reach.rs"
[[test]]
name = "peer_reach_upnp"
path = "tests/peer_reach_upnp.rs"

[dependencies]
# The shared `tcr status --json` wire type (`AccountStatusRow`), consumed by
# `render_accounts_json` in `src/cli.rs`.
tcr-status-wire = { path = "crates/tcr-status-wire" }
# The descriptor transport and peer code-signature check for the socket
# handoff. A separate crate so the unsafe they require stays out of this one,
# which is #![forbid(unsafe_code)].
tcr-fdpass = { path = "crates/tcr-fdpass" }
# async runtime + HTTP
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "sync", "time", "signal"] }
axum = { version = "0.8", features = ["http2"] }
hyper = { version = "1", features = ["server", "http1", "http2"] }
# TokioIo: the only bridge from tokio AsyncRead/Write to hyper 1.x rt::Read/Write,
# needed to serve the axum router over a raw/TLS stream in MITM mode. Already in
# the tree transitively (via axum/reqwest); this just pins the glue we call directly.
# "server-auto" pulls in the auto h1/h2-negotiating connection builder
# (hyper_util::server::conn::auto::Builder) used in src/mitm.rs so base-URL/MITM
# clients can negotiate h2 instead of being forced to h1.
hyper-util = { version = "0.1", features = ["tokio", "server-auto"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "json", "rustls-tls", "http2"] }
tower = "0.5"
bytes = "1"
futures = "0.3"

# SSE parsing that survives chunk-split event boundaries (the JS bug we design out)
eventsource-stream = "0.2"

# serde config (drop-in on ~/.config/teamclaude.json)
serde = { version = "1", features = ["derive"] }
# `raw_value` is a DEPENDENCY-FREE feature flag (serde_json's own Cargo.toml
# declares `raw_value = []`), so this adds no package. It lets account_uuid.rs
# borrow the verbatim source bytes of `metadata.user_id` instead of hand-rolling
# a JSON container-stack state machine to find them.
serde_json = { version = "1", features = ["raw_value"] }
# gzip for the usage ledger's closed days (`src/usage.rs`, "Closed days are gzipped"): a day
# of ledger lines is about 20 MB and is kept for `usageRetentionDays`. Default features: the
# pure-Rust miniz_oxide backend, so no C library comes with it.
flate2 = "1.1.10"

# OAuth PKCE login (browser flow): standard client for PKCE/CSRF/authorize-URL.
# default-features off — we only use the URL/PKCE builders, not oauth2's own HTTP
# client (Claude's token endpoint is non-standard JSON, exchanged manually below).
oauth2 = { version = "5", default-features = false }

# The OAuth callback query parser. Already resolved at 1.2.2 in Cargo.lock via
# three MANDATORY paths (axum directly; serde_urlencoded via axum+reqwest; url
# via oauth2+reqwest), so promoting it to a direct dep adds ZERO packages — it
# just stops us hand-rolling %XX/`+` decoding in oauth.rs.
form_urlencoded = "1"

# TUI
ratatui = "0.30"
# MUST stay on whatever major `ratatui` re-exports as `ratatui::crossterm`
# (0.30 -> ratatui-crossterm 0.1 -> crossterm 0.29). When it did not, cargo
# built BOTH 0.28 and 0.29 -- two copies of the terminal library, each with its
# own rustix, in one binary.
#
# Dropping this direct dep entirely does not work: `EventStream` lives behind
# crossterm's `event-stream` feature and ratatui exposes no passthrough for it
# (`event-stream` appears only in ratatui's own dev-dependencies), so the
# re-export alone cannot give us the async event source `tui.rs` needs.
#
# What DOES make the drift un-silenceable is where `tui.rs` imports from: every
# shared type comes from `ratatui::crossterm`, and only `EventStream` from here.
# If these two versions ever separate again, the stream yields one crate's
# `Event` while the match arms expect the other's, and it stops compiling --
# instead of quietly compiling twice. The error reads `expected Event, found
# Event`, which looks like a compiler bug and is really this line drifting.
crossterm = { version = "0.29", features = ["event-stream"] }

# CLI, errors, logging, time, paths
clap = { version = "4", features = ["derive"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# `local-offset` is what makes "today" a LOCAL calendar day in `usage.rs`.
# time 0.3.55 resolves the offset with `localtime_r` for the instant asked about
# (`src/sys/local_offset_at/unix.rs`), so it is DST-correct per record and — unlike
# pre-0.3.37 — carries no multi-threaded-process refusal, which is why this needs
# no change to how `main` builds the tokio runtime.
time = { version = "0.3", features = ["formatting", "parsing", "macros", "local-offset"] }
tokio-rustls = { version = "0.26.4", default-features = false, features = ["ring", "tls12", "logging"] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pemfile = "2.2.0"
rcgen = "0.14.8"
tracing-appender = "0.2.5"
tempfile = "3.27"

# Port-listener enumeration and process kill/argv (singleton.rs), replacing five
# hand-rolled `ps`/`lsof`/`kill` subprocess spawns. `listeners` reads
# /proc/net/{tcp,udp}{,6} + /proc/<pid>/fd (Linux, via rustix syscalls) or libproc
# (macOS) -- no subprocess. `sysinfo`'s `system` feature is the only one we need:
# `Process::cmd()`/`kill_with()` replace `ps`/`kill`. default-features off drops
# `component`/`disk`/`network`/`user` (and the objc2-open-directory dep `user`
# pulls in on macOS); `system` itself still needs `objc2-core-foundation` and
# `objc2-io-kit` there, which is expected, not a regression to chase.
listeners = "0.6"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
# Noise for the peer mesh (`tcr peer`, src/peer/noise.rs): `XX` plus a six-digit
# compare for a first pairing (a discovered machine announces no key, so there is
# nothing else to run), `IK` for a return visit to a pinned key (so no identity
# appears on the wire to a passive LAN observer), `IKpsk1` for the one path that
# starts with a key (a pasted join token), which is what lets a machine with no
# display enrol. The reference Rust implementation.
#
# `default-features = false` because the default pulls aes-gcm and blake2 we never
# call. Do NOT reach for the ring resolver: `RingResolver::resolve_dh` returns
# `None` (snow-0.10.0/src/resolvers/ring.rs), so `ring-resolver` compiles and then
# fails at RUNTIME with no X25519 provider, and `ring-accelerated` alongside
# `default-features = false` trips snow's own `compile_error!` gate, which demands
# a DH, a cipher and a hash feature. SHA256 rather than BLAKE2s keeps the suite
# inside `use-sha2`, which this lock already resolved.
#
# Measured in-tree cost, both numbers because a reader needs both: 12 new crate
# NAMES, 13 new lock ENTRIES. The thirteenth is a second VERSION of a name already
# present (chacha20 0.9.1 beside the repo's 0.10.1), not a hidden crate.
snow = { version = "0.10", default-features = false, features = ["use-curve25519", "use-chacha20poly1305", "use-sha2", "use-getrandom", "std"] }
# DNS-SD discovery for `tcr peer find` (src/peer/discovery.rs), behind two
# functions and `find` off by default, so the implementation can be swapped
# without touching trust: under Noise a forged beacon buys nothing, because all
# trust comes from the handshake against a pinned static key.
#
# DNS-SD is 60 pages of RFC and hand-rolling per-platform multicast socket
# handling is the classic own-goal; it is also the discovery mechanism the rest of
# macOS uses, so a peer is visible to standard tooling. The recorded alternative
# is a 48-byte UDP beacon behind the same two functions at zero new packages.
#
# Measured in-tree cost: FIVE new lock entries: flume, if-addrs, mdns-sd,
# socket-pktinfo and spin. The design predicted four and did not name `spin`.
mdns-sd = "0.21"
# Walks the real interface list for the Peers tab's "is there a LAN to look
# on" fact (src/status/network_fact.rs). A route lookup on a documentation
# address stood in first, but that needs a default gateway: a Mac with an
# interface up and addressed and NO gateway (a hotspot with no uplink, an
# isolated office LAN, two Macs on a link with no router) still finds peers
# over mDNS on it, and the route trick read that Mac as having no network.
# `if-addrs` is already resolved in `Cargo.lock` through `mdns-sd` above, so
# this adds one dependency EDGE and no new package.
if-addrs = "0.15"
# The peer-mesh wire types, shared by both ends of a peer stream: the same
# split, and for the same reason, as `tcr-status-wire` above.
tcr-peer-wire = { path = "crates/tcr-peer-wire" }
# The 128 opaque bits of a lease id (`Ledger::grant`, src/peer/lease.rs). Granted
# as a DIRECT dependency rather than reached for through `snow`: 0.3.4 is already
# in `Cargo.lock` (snow's `use-getrandom` resolves it), so this adds one
# dependency EDGE and no package. A lease id is not Noise material and minting it
# through `noise::random_secret` would make the one file that may name `snow::`
# the source of a number that has nothing to do with a handshake.
getrandom = "0.4"
# HMAC-SHA256 for the opt-in network key's announcement tag
# (`NetworkKey::announcement_tag`, src/peer/config.rs). Granted as a DIRECT
# dependency for the same reason `getrandom` above is: 0.10.9 is already in
# `Cargo.lock` because `snow`'s `use-sha2` feature resolves it, so this adds one
# dependency EDGE and no package (`cargo tree -i sha2`). The HMAC construction
# itself is twenty lines of RFC 2104 beside the key, because `hmac` is NOT in
# the lock (`cargo tree -i hmac` prints nothing) and would be a genuinely new
# package; it is verified against RFC 4231's test case 2, not against itself.
sha2 = "0.11"
# ChaCha20-Poly1305 for the sealed per-pair record (`peer::drop::seal`).
# Granted as a DIRECT dependency for the same reason `getrandom` and `sha2`
# above are: 0.10.1 is already in `Cargo.lock` because `snow`'s
# `use-chacha20poly1305` feature resolves it, so this adds one dependency EDGE
# and no package (`cargo tree -i chacha20poly1305` prints `snow` as the only
# other parent). Unlike the HMAC beside it, this one is NOT hand-rolled: RFC
# 2104 is twenty lines with published vectors and an AEAD is not, and reaching
# the same cipher through `snow` would mean naming `snow::` outside
# `src/peer/noise.rs` and building a second key exchange to get at a one-shot
# seal the crate does not expose.
#
# `alloc` only, default features off: the default set also turns on this
# crate's own `getrandom`, which is a feature edge onto `crypto-common` that
# buys nothing here, the nonce comes from the `getrandom` grant above. With it
# off, `git diff Cargo.lock` is one line.
chacha20poly1305 = { version = "0.10", default-features = false, features = ["alloc"] }

[dev-dependencies]
# Property tests over the peer-mesh wire's parse/decode boundary
# (`tests/peer_props.rs`). Gil approved this as a dev-dependency on
# 2026-09-18, and no other new dependency.
proptest = "1"
# This crate again, with `test-support` on, so the integration tests under `tests/` reach the
# same `tcr::test_support` (fixtures, stub upstreams, loopback helpers) the unit tests use, rather
# than a hand copy of it. A path dependency on itself: no package is added.
tcr = { path = ".", features = ["test-support"] }

[features]
# Compiles `src/test_support` into the library for the integration tests (see the
# dev-dependency above). Never on in a release build: nothing outside tests enables it.
test-support = []

# Incremental compilation is off, and stays off. sccache cannot serve an incremental compile
# (`sccache --show-stats` lists it under `Non-cacheable reasons: incremental`), so with it on every
# new checkout or worktree recompiles the whole `tcr` crate itself; and its state costs GBs of disk
# per target dir. The price is a slower edit loop in a single checkout.
[profile.dev]
incremental = false

# `cargo test` builds with this profile, which inherits `dev`; stated so nobody has to know that.
[profile.test]
incremental = false

# Release is already non-incremental by cargo's default.
[profile.release]
opt-level = 3
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
